<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtime Button Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #588157 0%, #344e41 50%, #2d3e35 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #f5f5f0;
        }
        .test-container {
            background: rgba(245, 245, 240, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(163, 177, 138, 0.3);
            border-radius: 1.5rem;
            padding: 2rem;
            color: #344e41;
        }
        .test-btn {
            background: linear-gradient(135deg, #588157, #344e41);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            margin: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(88, 129, 87, 0.4);
        }
        .status {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 0.5rem;
        }
        .status.success {
            background: rgba(88, 129, 87, 0.1);
            border: 1px solid #588157;
            color: #588157;
        }
        .status.error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-container">
            <h1><i class="fas fa-mobile-alt"></i> Airtime Button Test</h1>
            <p>This test checks if jQuery is loading properly and buttons are clickable.</p>
            
            <div id="jquery-status" class="status">
                <i class="fas fa-spinner fa-spin"></i> Checking jQuery...
            </div>
            
            <div class="mt-4">
                <h3>Test Buttons</h3>
                <button class="test-btn" id="test-btn-1">
                    <i class="fas fa-shopping-cart"></i> Test Button 1
                </button>
                <button class="test-btn" id="test-btn-2">
                    <i class="fas fa-bolt"></i> Test Button 2
                </button>
                <button class="test-btn" id="test-btn-3">
                    <i class="fas fa-plus"></i> Test Button 3
                </button>
            </div>
            
            <div id="click-status" class="status" style="display: none;">
                <i class="fas fa-info-circle"></i> <span id="click-message"></span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Check if jQuery loaded
        $(document).ready(function() {
            console.log('jQuery loaded successfully');
            
            // Update jQuery status
            $('#jquery-status')
                .removeClass('error')
                .addClass('success')
                .html('<i class="fas fa-check-circle"></i> jQuery loaded successfully!');
            
            // Button click handlers
            $('#test-btn-1').click(function() {
                console.log('Button 1 clicked');
                $('#click-status')
                    .show()
                    .removeClass('error')
                    .addClass('success')
                    .find('#click-message')
                    .text('Button 1 clicked successfully!');
            });
            
            $('#test-btn-2').click(function() {
                console.log('Button 2 clicked');
                $('#click-status')
                    .show()
                    .removeClass('error')
                    .addClass('success')
                    .find('#click-message')
                    .text('Button 2 clicked successfully!');
            });
            
            $('#test-btn-3').click(function() {
                console.log('Button 3 clicked');
                $('#click-status')
                    .show()
                    .removeClass('error')
                    .addClass('success')
                    .find('#click-message')
                    .text('Button 3 clicked successfully!');
            });
            
            // Add hover effects
            $('.test-btn').hover(
                function() {
                    $(this).css('transform', 'translateY(-4px) scale(1.05)');
                },
                function() {
                    $(this).css('transform', 'translateY(0) scale(1)');
                }
            );
        });
        
        // Fallback if jQuery doesn't load
        setTimeout(function() {
            if (typeof jQuery === 'undefined') {
                console.error('jQuery failed to load');
                $('#jquery-status')
                    .removeClass('success')
                    .addClass('error')
                    .html('<i class="fas fa-times-circle"></i> jQuery failed to load from CDN!');
                
                // Try to load jQuery again
                var script = document.createElement('script');
                script.src = 'https://code.jquery.com/jquery-3.6.0.min.js';
                script.onload = function() {
                    console.log('jQuery loaded successfully on retry');
                    location.reload();
                };
                script.onerror = function() {
                    console.error('jQuery retry also failed');
                    $('#jquery-status').html('<i class="fas fa-times-circle"></i> jQuery completely failed to load. Check internet connection.');
                };
                document.head.appendChild(script);
            }
        }, 2000);
    </script>
</body>
</html>
