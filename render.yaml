# Render.com Deployment Configuration - SQLite Only
services:
  # Web Service
  - type: web
    name: futurepos-django
    env: docker
    plan: free
    buildCommand: "python manage.py collectstatic --noinput --clear && python manage.py migrate"
    startCommand: "gunicorn confige.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: confige.settings
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        value: cy3fbhBI38T_ult5rpcVi1vAqEjNZEJ-PcBmTBrwDhyVMVf2lN6ljx4h9On2MKThwxg
      - key: DJANGO_ALLOWED_HOSTS
        value: ndtechpos.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: PORT
        value: 10000
      - key: RENDER_URL
        value: https://ndtechpos.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: false
      - key: SESSION_COOKIE_SECURE
        value: false
      - key: CSRF_COOKIE_SECURE
        value: false

# Optional: Redis for session storage (if needed)
#  - type: redis
#    name: futurepos-redis
#    plan: free
