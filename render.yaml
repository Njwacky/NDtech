# Render.com Deployment Configuration - PostgreSQL + Web Service
services:
  # Web Service
  - type: web
    name: futurepos-django
    env: docker
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput --clear"
    startCommand: "python deploy_fix.py && gunicorn confige.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: confige.settings
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ndtech.onrender.com,ndtechpos.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: PORT
        value: 10000
      - key: RENDER_URL
        value: https://ndtech.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: futurepos-db
          property: connectionString
      - key: FCM_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "false" 
      - key: SESSION_COOKIE_SECURE
        value: "false"
      - key: CSRF_COOKIE_SECURE
        value: "false"

databases:
  - name: futurepos-db
    databaseName: futurepos
    user: futurepos
    plan: free # Note: Free DBs expire after 90 days. Upgrade for production persistence.
