# Render.com Deployment Configuration - SQLite Only
services:
  # Web Service
  - type: web
    name: futurepos-django
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn confige.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /admin/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: confige.settings
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ndtechpos.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: PORT
        value: 10000
      - key: RENDER_URL
        value: https://ndtechpos.onrender.com

# Optional: Redis for session storage (if needed)
#  - type: redis
#    name: futurepos-redis
#    plan: free
