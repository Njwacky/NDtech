<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Shortcut Button</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-width: 150px;
            justify-content: center;
        }

        .shortcuts-btn {
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: white;
        }

        .shortcuts-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
        }

        /* Shortcuts Modal */
        .shortcuts-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .shortcuts-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .shortcuts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .shortcuts-header h3 {
            color: #4a5568;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        .close-shortcuts {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #718096;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .close-shortcuts:hover {
            background: #f7fafc;
            color: #e53e3e;
        }

        .debug-info {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h3>Debug Information</h3>
        <p>Click the shortcut button and check the console for debug messages.</p>
        <p id="debug-status">Status: Ready</p>
    </div>

    <div class="action-buttons">
        <button class="action-btn shortcuts-btn" onclick="toggleShortcuts()">
            <i class="fa-solid fa-circle-info"></i> Shortcuts
        </button>
    </div>

    <!-- Shortcuts Modal -->
    <div id="shortcuts-modal" class="shortcuts-modal">
        <div class="shortcuts-content">
            <div class="shortcuts-header">
                <h3><i class="fa-solid fa-keyboard"></i> Keyboard Shortcuts & Quick Actions</h3>
                <button class="close-shortcuts" onclick="toggleShortcuts()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="shortcuts-grid">
                <div class="shortcut-category">
                    <h4><i class="fas fa-shopping-cart"></i> Cart Actions</h4>
                    <div class="shortcut-item">
                        <kbd>Ctrl</kbd> + <kbd>C</kbd>
                        <span>Clear Cart</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle shortcuts modal
        function toggleShortcuts() {
            const modal = document.getElementById('shortcuts-modal');
            const debugStatus = document.getElementById('debug-status');
            
            console.log('Toggle shortcuts called, modal:', modal);
            debugStatus.textContent = 'Status: toggleShortcuts() called';
            
            if (modal) {
                if (modal.style.display === 'none' || !modal.style.display) {
                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                    console.log('Modal opened');
                    debugStatus.textContent = 'Status: Modal opened';
                } else {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                    console.log('Modal closed');
                    debugStatus.textContent = 'Status: Modal closed';
                }
            } else {
                console.error('Shortcuts modal not found');
                debugStatus.textContent = 'Status: ERROR - Modal not found';
            }
        }

        // Test event listener setup
        document.addEventListener('DOMContentLoaded', function() {
            const shortcutsButton = document.querySelector('.shortcuts-btn');
            if (shortcutsButton) {
                console.log('Shortcuts button found:', shortcutsButton);
                shortcutsButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Shortcuts button clicked via event listener');
                    toggleShortcuts();
                });
            } else {
                console.error('Shortcuts button not found');
            }
        });
    </script>
</body>
</html>
