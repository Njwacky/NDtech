{% extends 'nano/base_auth.html' %}
{% load static %}

{% block title %}Sign In - NDtech POS{% endblock %}

{% block content %}
  <div class="auth-header">
    <a class="brand" href="{% url 'home' %}">
      <img class="brand-logo" src="{% static 'nano/icon-96.png' %}" alt="NDtech" />
      <span>NDtech POS</span>
    </a>
    <h1>Sign in</h1>
    <p class="muted">Welcome back.</p>
  </div>

  <form class="auth-form" method="post" action="{% url 'sign_in' %}">
    {% csrf_token %}

    <label class="field">
      <span>Username</span>
      <input name="username" type="text" autocomplete="username" required value="{{ request.POST.username|default:'' }}" />
    </label>

    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required />
    </label>

    <button class="btn btn-primary" type="submit">Sign in</button>

    <div class="auth-links">
      <a href="{% url 'register' %}" class="link">Register</a>
      <span class="dot">•</span>
      <a href="{% url 'forgot_password' %}" class="link">Forgot password?</a>
    </div>
  </form>
{% endblock %}
