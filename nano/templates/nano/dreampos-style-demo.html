<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaza POS Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 78px 1fr 390px;
    }
    .sidebar {
      background: #111827;
      color: white;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff7a45, #ff3d57);
      display: grid;
      place-items: center;
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(255, 61, 87, .25);
    }
    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: #cbd5e1;
      background: rgba(255,255,255,.06);
      font-size: 21px;
      cursor: pointer;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #ff5a3c;
      color: #fff;
    }
    .main {
      padding: 22px;
      overflow: auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .hello h1 {
      margin: 0;
      font-size: 25px;
    }
    .hello p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 14px;
    }
    .search {
      flex: 1;
      max-width: 520px;
      position: relative;
    }
    .search input {
      width: 100%;
      border: 0;
      background: #fff;
      padding: 15px 18px 15px 45px;
      border-radius: 16px;
      font-size: 15px;
      outline: none;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .06);
    }
    .search span {
      position: absolute;
      left: 17px;
      top: 13px;
      color: #6b7280;
    }
    .cashier {
      background: #fff;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .06);
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #dbeafe;
      display: grid;
      place-items: center;
    }
    .category-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .cat {
      min-width: 112px;
      background: #fff;
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .05);
    }
    .cat.active {
      border-color: #ff5a3c;
      background: #fff7f4;
      color: #e04427;
    }
    .cat .icon { font-size: 26px; display: block; margin-bottom: 6px; }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 15px;
    }
    .section-title h2 { margin: 0; font-size: 20px; }
    .pill {
      background: #eef2ff;
      color: #4f46e5;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 15px;
    }
    .product {
      border: 0;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .06);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 35px rgba(15, 23, 42, .1);
    }
    .product-img {
      height: 112px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 46px;
      background: linear-gradient(135deg, #f8fafc, #e0f2fe);
      margin-bottom: 10px;
    }
    .product small {
      color: #6b7280;
      font-weight: 700;
    }
    .product h3 {
      margin: 6px 0;
      font-size: 15px;
      min-height: 36px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .price {
      color: #111827;
      font-size: 17px;
      font-weight: 900;
    }
    .add {
      background: #111827;
      color: #fff;
      border-radius: 12px;
      padding: 7px 10px;
      font-weight: 800;
    }
    .cart-panel {
      background: #fff;
      padding: 20px;
      border-left: 1px solid #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .cart-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .cart-head h2 { margin: 0; font-size: 22px; }
    .cart-head p { margin: 5px 0 0; color: #6b7280; font-size: 13px; }
    .clear-btn {
      border: 0;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 12px;
      padding: 9px 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .customer-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .customer-box label { font-size: 12px; color: #6b7280; font-weight: 800; }
    .customer-box input, .customer-box select {
      width: 100%;
      margin-top: 5px;
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 12px;
      padding: 10px;
      outline: none;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      min-height: 180px;
    }
    .empty {
      height: 230px;
      border: 2px dashed #e5e7eb;
      border-radius: 18px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .mini-img {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      font-size: 23px;
    }
    .cart-item h4 { margin: 0 0 4px; font-size: 14px; }
    .cart-item small { color: #6b7280; }
    .qty {
      display: flex;
      align-items: center;
      gap: 7px;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .qty button {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 8px;
      background: #e5e7eb;
      cursor: pointer;
      font-weight: 900;
    }
    .line-total { font-weight: 900; text-align: right; }
    .summary {
      border-top: 1px solid #e5e7eb;
      padding-top: 14px;
      margin-top: 12px;
    }
    .sum-row {
      display: flex;
      justify-content: space-between;
      margin: 9px 0;
      color: #4b5563;
    }
    .sum-row.total {
      font-size: 23px;
      color: #111827;
      font-weight: 900;
      border-top: 1px dashed #d1d5db;
      padding-top: 12px;
      margin-top: 12px;
    }
    .pay-input {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }
    .pay-input input, .pay-input select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 12px;
      outline: none;
      font-size: 14px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .action {
      border: 0;
      border-radius: 15px;
      padding: 13px 10px;
      font-weight: 900;
      cursor: pointer;
    }
    .hold { background: #fef3c7; color: #92400e; }
    .void { background: #fee2e2; color: #b91c1c; }
    .orders { background: #e0f2fe; color: #0369a1; }
    .pay {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #ff7043, #ff3157);
      color: white;
      font-size: 16px;
      box-shadow: 0 12px 25px rgba(255, 49, 87, .25);
    }
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #111827;
      color: white;
      padding: 13px 18px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,.22);
      transition: .25s ease;
      z-index: 10;
      font-weight: 800;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 70px 1fr; }
      .cart-panel { grid-column: 1 / -1; min-height: auto; border-left: 0; }
    }
    @media (max-width: 700px) {
      .app { display: block; }
      .sidebar { flex-direction: row; height: auto; justify-content: center; }
      .topbar { flex-direction: column; align-items: stretch; }
      .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cart-panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">SP</div>
      <div class="nav-btn active" title="POS">🛒</div>
      <div class="nav-btn" title="Products">📦</div>
      <div class="nav-btn" title="Sales">📊</div>
      <div class="nav-btn" title="Customers">👥</div>
      <div class="nav-btn" title="Settings">⚙️</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="hello">
          <h1>Spaza Shop POS</h1>
          <p>Welcome, Cashier • Today: <span id="dateText"></span></p>
        </div>
        <div class="search">
          <span>🔎</span>
          <input id="searchInput" placeholder="Search product: bread, coke, airtime..." />
        </div>
        <div class="cashier">
          <div class="avatar">👨‍💼</div>
          <div>
            <strong>Cashier 01</strong><br>
            <small style="color:#6b7280">Online</small>
          </div>
        </div>
      </div>

      <div class="category-row" id="categoryRow"></div>

      <div class="section-title">
        <h2>Products</h2>
        <span class="pill" id="countPill">0 items</span>
      </div>
      <div class="products" id="products"></div>
    </main>

    <aside class="cart-panel">
      <div class="cart-head">
        <div>
          <h2>Current Sale</h2>
          <p>Build cart, take manual payment, complete sale.</p>
        </div>
        <button class="clear-btn" onclick="clearCart()">Reset</button>
      </div>

      <div class="customer-box">
        <div>
          <label>Customer</label>
          <input value="Walk-in" />
        </div>
        <div>
          <label>Sale Type</label>
          <select>
            <option>Counter Sale</option>
            <option>Lay-bye</option>
            <option>Account</option>
          </select>
        </div>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="summary">
        <div class="sum-row"><span>Subtotal</span><strong id="subtotal">R0.00</strong></div>
        <div class="sum-row"><span>Discount</span><strong>R0.00</strong></div>
        <div class="sum-row"><span>VAT/Tax</span><strong>R0.00</strong></div>
        <div class="sum-row total"><span>Total</span><span id="total">R0.00</span></div>

        <div class="pay-input">
          <select id="payMethod">
            <option>Cash</option>
            <option>Card</option>
            <option>EFT</option>
            <option>Other</option>
          </select>
          <input id="amountPaid" type="number" min="0" placeholder="Amount paid" oninput="renderCart()" />
        </div>
        <div class="sum-row"><span>Change</span><strong id="change">R0.00</strong></div>

        <div class="actions">
          <button class="action hold" onclick="showToast('Sale placed on hold')">Hold</button>
          <button class="action void" onclick="clearCart(); showToast('Transaction voided')">Void</button>
          <button class="action orders" onclick="showToast('Orders page demo')">View Orders</button>
          <button class="action pay" onclick="completeSale()">Payment / Complete Sale</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast">Done</div>

  <script>
    const categories = [
      { name: 'All', icon: '🏪' },
      { name: 'Food', icon: '🍞' },
      { name: 'Drinks', icon: '🥤' },
      { name: 'Snacks', icon: '🍫' },
      { name: 'Household', icon: '🧼' },
      { name: 'Airtime', icon: '📱' },
      { name: 'Tobacco', icon: '🚬' }
    ];

    const products = [
      { id: 1, name: 'Brown Bread', category: 'Food', price: 18.99, icon: '🍞' },
      { id: 2, name: 'White Bread', category: 'Food', price: 17.99, icon: '🥖' },
      { id: 3, name: '2L Coke', category: 'Drinks', price: 29.99, icon: '🥤' },
      { id: 4, name: '500ml Coke', category: 'Drinks', price: 12.00, icon: '🧃' },
      { id: 5, name: 'Simba Chips', category: 'Snacks', price: 9.99, icon: '🍟' },
      { id: 6, name: 'Chocolate Bar', category: 'Snacks', price: 11.50, icon: '🍫' },
      { id: 7, name: 'Milk 1L', category: 'Food', price: 22.50, icon: '🥛' },
      { id: 8, name: 'Eggs 6 Pack', category: 'Food', price: 21.00, icon: '🥚' },
      { id: 9, name: 'Sunlight Soap', category: 'Household', price: 15.00, icon: '🧼' },
      { id: 10, name: 'Toilet Paper', category: 'Household', price: 12.50, icon: '🧻' },
      { id: 11, name: 'Airtime R10', category: 'Airtime', price: 10.00, icon: '📱' },
      { id: 12, name: 'Airtime R20', category: 'Airtime', price: 20.00, icon: '📲' },
      { id: 13, name: 'Cigarettes Single', category: 'Tobacco', price: 3.00, icon: '🚬' },
      { id: 14, name: 'Matches', category: 'Household', price: 2.50, icon: '🔥' }
    ];

    let selectedCategory = 'All';
    let cart = [];

    const money = (n) => 'R' + Number(n || 0).toFixed(2);

    document.getElementById('dateText').textContent = new Date().toLocaleDateString('en-ZA', {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });

    function renderCategories() {
      const row = document.getElementById('categoryRow');
      row.innerHTML = categories.map(cat => `
        <div class="cat ${cat.name === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat.name}')">
          <span class="icon">${cat.icon}</span>
          <strong>${cat.name}</strong>
        </div>
      `).join('');
    }

    function selectCategory(name) {
      selectedCategory = name;
      renderCategories();
      renderProducts();
    }

    function filteredProducts() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return products.filter(p => {
        const matchCat = selectedCategory === 'All' || p.category === selectedCategory;
        const matchSearch = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });
    }

    function renderProducts() {
      const list = filteredProducts();
      document.getElementById('countPill').textContent = `${list.length} items`;
      document.getElementById('products').innerHTML = list.map(p => `
        <button class="product" onclick="addToCart(${p.id})">
          <div class="product-img">${p.icon}</div>
          <small>${p.category}</small>
          <h3>${p.name}</h3>
          <div class="price-row">
            <span class="price">${money(p.price)}</span>
            <span class="add">+ Add</span>
          </div>
        </button>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = cart.find(i => i.id === id);
      if (item) item.qty += 1;
      else cart.push({ ...product, qty: 1 });
      renderCart();
      showToast(`${product.name} added`);
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      renderCart();
    }

    function clearCart() {
      cart = [];
      document.getElementById('amountPaid').value = '';
      renderCart();
    }

    function cartTotal() {
      return cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    }

    function renderCart() {
      const box = document.getElementById('cartItems');
      if (!cart.length) {
        box.innerHTML = `<div class="empty"><div><strong>No items in cart</strong><br><br>Click products on the left to start a sale.</div></div>`;
      } else {
        box.innerHTML = cart.map(i => `
          <div class="cart-item">
            <div class="mini-img">${i.icon}</div>
            <div>
              <h4>${i.name}</h4>
              <small>${money(i.price)} each</small>
              <div class="qty">
                <button onclick="changeQty(${i.id}, -1)">−</button>
                <strong>${i.qty}</strong>
                <button onclick="changeQty(${i.id}, 1)">+</button>
              </div>
            </div>
            <div class="line-total">${money(i.price * i.qty)}</div>
          </div>
        `).join('');
      }
      const total = cartTotal();
      const paid = Number(document.getElementById('amountPaid').value || 0);
      document.getElementById('subtotal').textContent = money(total);
      document.getElementById('total').textContent = money(total);
      document.getElementById('change').textContent = money(Math.max(0, paid - total));
    }

    function completeSale() {
      const total = cartTotal();
      const paid = Number(document.getElementById('amountPaid').value || 0);
      const method = document.getElementById('payMethod').value;
      if (!cart.length) return showToast('Cart is empty');
      if (method === 'Cash' && paid < total) return showToast('Cash paid is less than total');
      showToast(`Sale completed: ${money(total)} by ${method}`);
      clearCart();
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.getElementById('searchInput').addEventListener('input', renderProducts);
    renderCategories();
    renderProducts();
    renderCart();
  </script>
