{% extends 'nano/base.html' %}
{% load static %}

{% block title %}Logout - NDtech{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'nano/logout.css' %}">
{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="success-icon">✅</div>
    <h1>You have been logged out</h1>
    <div class="logout-message">
        Thank you for using the FuturePOS system.
    </div>
    <p>Have a great day!</p>
    <a href="{% url 'sign_in' %}">Sign In Again</a>
    <div class="footer-info">
        FuturePOS System v1.0
    </div>
</div>
{% endblock %}
